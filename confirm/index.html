<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Confirm a payment · Vedsora</title>
<style>
:root{--bg:#f3f6f7;--card:#fff;--ink:#14212b;--muted:#566673;--line:#d7dfe4;--accent:#0d6a66;--accent-ink:#fff;--bad:#a1362a}
@media (prefers-color-scheme:dark){:root{--bg:#0d151b;--card:#16212a;--ink:#e7eef2;--muted:#95a7b4;--line:#2a3945;--accent:#4fc0b8;--accent-ink:#06201e;--bad:#f09b8f}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif;
 padding:max(16px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) max(16px,env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
main{max-width:440px;margin:0 auto;display:grid;gap:16px}
.brand{font:600 14px system-ui;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:20px;display:grid;gap:14px}
h1{margin:0;font:600 22px/1.25 system-ui;text-wrap:balance}
p{margin:0}.muted{color:var(--muted);font-size:14px}
button{font:inherit;font-weight:600;border-radius:10px;padding:14px;border:1px solid var(--line);background:var(--card);color:var(--ink);cursor:pointer;width:100%}
button.yes{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
button:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
button[disabled]{opacity:.55;cursor:wait}
label{display:grid;gap:6px;font-size:14px;color:var(--muted)}
input{font:inherit;padding:12px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink)}
.err{color:var(--bad);font-size:14px}
a{color:var(--accent)}
</style>
</head>
<body>
<main>
  <div class="brand">Vedsora</div>
  <div class="card" id="card" aria-live="polite"><p>Loading…</p></div>
  <p class="muted">You do not need an account. If you ignore this, nothing happens. <a id="privacy" href="#">How we use your answer</a></p>
</main>
<script src="/vedsora-config.js"></script>
<script>
(function () {
  'use strict';
  var C = window.VEDSORA_CONFIG || {};
  var card = document.getElementById('card');
  var token = new URLSearchParams(location.search).get('t') || '';
  document.getElementById('privacy').href = C.PRIVACY_URL || '/privacy.html';

  function money(n) { return '£' + Number(n).toLocaleString('en-GB', { minimumFractionDigits: Number.isInteger(Number(n)) ? 0 : 2 }); }
  function dfmt(s) { return new Date(s + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'long', year: 'numeric' }); }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function rpc(name, body) {
    return fetch(C.SUPABASE_URL + '/rest/v1/rpc/' + name, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', apikey: C.SUPABASE_ANON_KEY },
      body: JSON.stringify(body)
    }).then(function (r) { if (!r.ok) throw new Error('http ' + r.status); return r.json(); });
  }
  function msg(title, text) { card.innerHTML = '<h1>' + esc(title) + '</h1><p class="muted">' + esc(text) + '</p>'; }
  function oops() { card.innerHTML = '<h1>Something went wrong</h1><p class="err">We could not reach the service. Please try the link again in a minute.</p>'; }

  function show(v) {
    var amt = money(v.amount);
    card.innerHTML =
      '<p class="muted">' + esc(v.musician) + ' asks you to confirm</p>' +
      '<h1>Did you pay ' + esc(v.musician) + ' ' + amt + (v.work ? ' for ' + esc(v.work.toLowerCase()) : '') + ' on ' + dfmt(v.date) + '?</h1>' +
      '<button class="yes" id="yes">Yes, I paid ' + amt + '</button>' +
      '<button id="diff">I paid a different amount</button>' +
      '<button id="no">No, or I would rather not say</button>' +
      '<div id="form" hidden><label for="amt">Amount you paid (£)<input id="amt" type="number" inputmode="decimal" min="0.01" step="0.01"></label>' +
      '<button class="yes" id="send">Send this amount</button><p class="err" id="e" role="alert"></p></div>';
    function send(action, amount) {
      Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = true; });
      rpc('respond_confirmation', { p_token: token, p_action: action, p_amount: amount == null ? null : amount }).then(function (r) {
        if (r.ok && r.status === 'confirmed') msg('Thank you', 'Your answer has been recorded. You can close this page.');
        else if (r.ok) msg('Understood', 'We have recorded that you did not confirm. You can close this page.');
        else if (r.error === 'already_answered') msg('Already answered', 'This request has already been answered.');
        else if (r.error === 'expired') msg('This link has expired', 'Ask the musician to send a new request if you still want to confirm.');
        else if (r.error === 'bad_amount') { Array.prototype.forEach.call(card.querySelectorAll('button'), function (b) { b.disabled = false; }); document.getElementById('e').textContent = 'Enter an amount above zero.'; }
        else oops();
      }).catch(oops);
    }
    document.getElementById('yes').onclick = function () { send('confirm'); };
    document.getElementById('no').onclick = function () { send('decline'); };
    document.getElementById('diff').onclick = function () { document.getElementById('form').hidden = false; document.getElementById('amt').focus(); };
    document.getElementById('send').onclick = function () {
      var n = parseFloat(document.getElementById('amt').value);
      if (!(n > 0)) { document.getElementById('e').textContent = 'Enter an amount above zero.'; return; }
      send('different', n);
    };
  }

  if (!token) { msg('This link is incomplete', 'Please open the link exactly as the musician sent it.'); return; }
  rpc('get_confirmation', { p_token: token }).then(function (v) {
    if (v.error === 'too_many') oops();
    else if (!v.valid) msg('This link is not valid', 'It may have been replaced by a newer request. Ask the musician to send it again.');
    else if (v.status === 'pending') show(v);
    else if (v.status === 'expired') msg('This link has expired', 'Ask the musician to send a new request if you still want to confirm.');
    else msg('Already answered', 'This request has already been answered. Nothing more is needed.');
  }).catch(oops);
})();
</script>
</body>
</html>
